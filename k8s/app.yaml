apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-assist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-assist
  template:
    metadata:
      labels:
        app: travel-assist
    spec:
      containers:
        - name: travel-assist
          image: youracr.azurecr.io/travel-assist:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: TRUST_PROXY
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: travel-assist-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: travel-assist
spec:
  selector:
    app: travel-assist
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
